name: Test

on:
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        toxenv: [py312, linting]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install tox
        run: pip install tox

      - name: Run tox
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: tox
